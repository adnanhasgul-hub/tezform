name: Validate Required Fields Change

on:
  push:
    branches:
      - ui/required-public-fields

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        id: unit_tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload unit test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-fields-unit-test-output
          path: test-output.txt
          retention-days: 1

      - name: Stop on unit test failure
        if: steps.unit_tests.outputs.status != '0'
        run: exit 1

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build
        run: npm run build
